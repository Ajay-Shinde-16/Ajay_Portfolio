spring.application.name=portfolio-backend
server.port=${PORT:8080}

# ---- Database ----------------------------------------------------------------
# File-backed H2 so contact messages survive restarts (stored in ./data).
spring.datasource.url=jdbc:h2:file:./data/portfolio;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Browse the DB while running at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- CORS --------------------------------------------------------------------
# Comma-separated list. Add your deployed frontend URL here in production.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# ---- Admin -------------------------------------------------------------------
# Token required to read GET /api/contact. CHANGE THIS and pass it as the
# "X-Admin-Token" header. Override via env: APP_ADMIN_TOKEN=...
app.admin.token=${APP_ADMIN_TOKEN:change-me}

# Where contact notifications are sent.
app.contact.recipient=Ajay.shinde1606@gmail.com

# ---- Email (optional) --------------------------------------------------------
# Leave blank and the app just logs new messages. To actually receive emails,
# set these (Gmail example) via environment variables in production:
#   MAIL_USERNAME=you@gmail.com
#   MAIL_PASSWORD=your-16-char-app-password   (Google account > App passwords)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
