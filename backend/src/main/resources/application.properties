spring.application.name=portfolio-backend
server.port=${PORT:8080}

# ---- Database ----------------------------------------------------------------
# File-backed H2. NOTE: on Render's free tier the disk is ephemeral, so stored
# messages reset on redeploy — but you still get the email, which is the point.
spring.datasource.url=jdbc:h2:file:./data/portfolio;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- CORS --------------------------------------------------------------------
# Add your deployed frontend URL(s), comma-separated, via APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ---- Admin -------------------------------------------------------------------
app.admin.token=${APP_ADMIN_TOKEN:change-me}

# ---- Contact / Email ---------------------------------------------------------
# Where the notification lands (your inbox):
app.contact.recipient=${APP_CONTACT_RECIPIENT:Ajay.shinde1606@gmail.com}
# The "From" address — must be a VERIFIED sender in Brevo:
app.mail.from=${APP_MAIL_FROM:${spring.mail.username:}}

# Brevo SMTP (set these as environment variables in Render):
#   MAIL_HOST=smtp-relay.brevo.com
#   MAIL_PORT=587
#   MAIL_USERNAME=<your Brevo SMTP login>
#   MAIL_PASSWORD=<your Brevo SMTP key>
# Leave blank and the app just logs each message instead of emailing.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true